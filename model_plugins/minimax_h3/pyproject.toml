[project]
name = "open-imagine-minimax-h3"
version = "0.1.0"
description = "A staged MiniMax H3 Q8 video backend for Open Imagine"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.entry-points."open_imagine.models.video"]
minimax_h3 = "open_imagine_h3:plugin"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "open_imagine_h3"
