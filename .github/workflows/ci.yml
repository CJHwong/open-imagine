name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: lint and tests
    # macOS on Apple Silicon, because mflux and mlx-vlm install only there. The suite mocks every
    # engine, so it needs no weights and no GPU; the `live` tests and tests/e2e stay manual.
    #
    # What a green run here proves: the studio's Python reaches every statement and branch, with
    # the engines faked. What it does not prove: that a CUDA kernel ran, that MLX allocated what
    # the estimate says, that the browser drew the page, or that the Android app saved a file.
    # Those are proven by the live tests on each machine and by tests/e2e, run by hand. Do not
    # read this gate as evidence for them.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The import-linter and ty hooks run `uv run --frozen`, so the env has to exist before prek.
      # --locked fails the job on a stale uv.lock. The interpreter follows `requires-python`:
      # uv.lock is a 3.12 resolution, so asking for another one fails before any test runs.
      - name: Sync the env
        run: uv sync --locked --python 3.12

      - name: prek
        run: |
          uv tool install prek
          prek run --all-files --show-diff-on-failure

      - name: pytest
        run: uv run --no-sync pytest -q

  browser:
    name: page in a browser
    # The page is JavaScript, and the mocked Python suite cannot see it. These checks
    # drive a real Chromium against `--stub`, so they need no weights, no GPU and no
    # model. They are the only per-pull-request evidence that the page draws, keeps and
    # restores anything.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Sync the env
        run: uv sync --locked --python 3.12

      - name: Install the browser
        run: uv run --with playwright python -m playwright install chromium

      - name: Start the stub studio
        run: |
          uv run studio --stub --port 8801 --all-backends > /tmp/studio.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8801/; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio.log
          exit 1

      - name: The gallery keeps what it is given, and restores a backup over it
        run: uv run --with playwright python tests/e2e/verify_gallery_transfer.py 8801

      - name: The page's controls answer a real click
        run: uv run --with playwright python tests/e2e/verify_ui.py 8801

      - name: Stop the studio
        if: always()
        run: kill %1 2>/dev/null || pkill -f "studio --stub --port 8801" || true

  plugin:
    name: agent plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The version check reads the base commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      # Pinned, so a new release cannot change the verdict on an unchanged tree. Its install script
      # runs: it fetches the native binary, and the CLI exits with "native binary not installed"
      # without it.
      - name: Install Claude Code
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/claude-code@2.1.310

      - name: Validate the plugin and the marketplace
        run: |
          set -euo pipefail
          # The directory profile also fails on what the plugin directory refuses, such as a
          # missing license; --strict fails on its warnings too, such as a missing icon.
          ./node_modules/.bin/claude plugin validate ./plugins/open-imagine --profile directory --strict
          ./node_modules/.bin/claude plugin validate .

      # Claude Code and Codex each read their own manifest, and an installed copy updates only when
      # the version changes. So a change under plugins/ must raise the version, in both manifests.
      - name: Plugin version raised when the plugin changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check_plugin_version.py "$BASE_SHA" "$HEAD_SHA"
