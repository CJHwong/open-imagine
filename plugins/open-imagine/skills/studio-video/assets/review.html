<header><div class="identity"><h1 id="project-title"></h1><span class="revision" id="revision"></span><span class="spec" id="spec"></span></div><div class="actions"><a id="download" class="download" download hidden>Download</a><button id="copy-prompt" title="Copy every note and decision as one prompt">Copy prompt</button><button id="export">Export feedback ↗</button></div></header>

<main><section class="list" id="list" aria-label="Review items"></section><section class="center"><div class="monitor-bar"><strong id="monitor-name">STORYBOARD</strong><span id="monitor-version"></span></div><div class="viewer" id="viewer"><img id="picture" alt="" hidden><video id="player" controls playsinline preload="metadata" hidden></video><div class="audio-stack" id="audio-stack" hidden></div><div class="empty" id="empty" hidden><strong id="empty-title"></strong><p id="empty-copy"></p></div><div class="sheet" id="sheet" hidden></div><span class="badge" id="badge"></span></div><div class="viewer-tools"><span class="position" id="position"></span><span class="time-display" id="monitor-time">00:00:00:00</span><div class="controls"><button id="play" title="Play / pause (Space)" aria-label="Play or pause">▶</button><button id="previous" title="Previous item (←)" aria-label="Previous item">←</button><button id="next" title="Next item (→)" aria-label="Next item">→</button><button id="overview" aria-pressed="false">Overview</button></div></div></section><aside id="inspector" aria-label="Review details"><div class="kicker" id="item-id"></div><h2 class="panel-title" id="item-title"></h2><p class="summary" id="description"></p><p class="status" id="item-status"></p><label class="field-label" for="version">Version</label><select id="version"></select><div class="decisions" aria-label="Version decision"><button data-decision="unreviewed">Unreviewed</button><button data-decision="approved">Keep</button><button data-decision="revise">Revise</button></div><label class="field-label" for="notes">Notes</label><textarea id="notes" placeholder="What should change?"></textarea><div class="note-actions"><button id="timecode" disabled>+ Playhead time</button><span id="saved">Draft saved locally</span></div><details id="made" open><summary>How it was made</summary><div class="detail" id="made-copy"></div></details><details id="direction"><summary>Action, sound & continuity</summary><div class="detail" id="direction-copy"></div></details><details id="references"><summary>References & motion</summary><div class="detail" id="reference-copy"></div></details><details id="technical-box"><summary>Technical details</summary><div class="detail" id="technical"></div></details><div class="links" id="asset-links"></div></aside></main>

<script>
'use strict';
const P=__DATA__;
const TEMPLATE='studio-film-review-v1';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const url=x=>encodeURI(x||'').replaceAll('#','%23').replaceAll('?','%3F');
const fps=P.settings.preview_render?.frame_rate||24;
const aspect=String(P.settings.aspect_ratio||'16:9').split(':').map(Number);
const thumbWidth=Math.max(62,Math.min(138,74*(aspect[0]/aspect[1]||16/9)));
document.documentElement.style.setProperty('--thumb-width',thumbWidth+'px');
const smpte=x=>{const frame=Math.max(0,Math.round((Number(x)||0)*fps)),sec=Math.floor(frame/fps);return [Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60,frame%fps].map(n=>String(n).padStart(2,'0')).join(':')};
const tc=x=>{const f=Math.round((Number(x)||0)*1000),sec=Math.floor(f/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')+(f%1000?'.'+String(f%1000).padStart(3,'0').replace(/0+$/,''):'')};
const all=[...P.shots,...P.assets], byId=new Map(all.map(n=>[n.id,n]));
const key=P.id+':screening-room:'+P.revision; // Preserve drafts from the existing shared review page.
const baseline=n=>n.versions.find(v=>v.id===n.selected);
function initial(){return Object.fromEntries(all.map(n=>[n.id,{id:n.id,base_selected:n.selected,selected:n.selected,review_status:baseline(n).review_status||'unreviewed',notes:baseline(n).notes||'',takes:{}}]))}
let draft=initial(),storageAvailable=true;
try{const stored=JSON.parse(localStorage.getItem(key)||'null');for(const n of all){const d=stored?.[n.id];if(d&&d.base_selected===n.selected&&n.versions.some(v=>v.id===d.selected))draft[n.id]={...draft[n.id],...d,takes:d.takes||{}}}}catch{storageAvailable=false}
// Keep the early bus storyboard's local notes when upgrading its bespoke page.
try{const old=JSON.parse(localStorage.getItem(P.id+'-storyboard-'+(P.production?.storyboard_version||'v001'))||'null');if(old&&!localStorage.getItem(key))for(const n of P.shots)if(typeof old[n.id]==='string')draft[n.id].notes=old[n.id]}catch{}
const take=n=>n.versions.find(v=>v.id===draft[n.id].selected);
const film=P.exports?.find(e=>e.path)||null;
const hasVideo=P.shots.some(s=>s.versions.some(v=>v.video));
let mode=film?'edit':'storyboard',selectedId=P.shots[0]?.id||null,assetId=P.assets[0]?.id||null,overview=false,toastTimer;
const player=$('#player');
function nodes(){return mode==='cast'?P.assets:P.shots}
function current(){return byId.get(mode==='cast'?assetId:selectedId)}
function thumbnail(n){const v=take(n);return mode==='storyboard'?(v.storyboard_image||v.reference||v.image):(v.image||v.reference||v.storyboard_image)}
function stale(n,seen=new Set()){if(seen.has(n.id))return false;seen.add(n.id);return (take(n).inputs||[]).some(i=>!draft[i.asset_id||i.shot_id]||draft[i.asset_id||i.shot_id].selected!==i.version||stale(byId.get(i.asset_id||i.shot_id),seen))}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
function save(){try{localStorage.setItem(key,JSON.stringify(draft));storageAvailable=true;$('#saved').textContent='Draft saved locally'}catch{storageAvailable=false;$('#saved').textContent='Export to retain notes'}progress()}
function renderCutTrack(){const active=current()?.id;$('#cut-track').innerHTML=P.shots.map(n=>`<button class="cut ${esc(draft[n.id].review_status)}" data-cut="${esc(n.id)}" aria-current="${n.id===active}" style="flex:${n.duration}" title="${esc(n.title||n.purpose||n.id)}"><strong>${esc(n.id)}</strong><span>${esc(n.title||n.purpose||'')}</span><small>${Number(n.duration.toFixed(2))}s</small></button>`).join('');$('#ruler').innerHTML=Array.from({length:7},(_,i)=>`<span>${tc(P.settings.target_seconds*i/6)}</span>`).join('');}
function progress(){renderCutTrack();const ns=nodes(),kept=ns.filter(n=>draft[n.id].review_status==='approved').length,revise=ns.filter(n=>draft[n.id].review_status==='revise').length;$('#progress').textContent=ns.length?`${kept} kept · ${revise} to revise · ${ns.length-kept-revise} unreviewed`:'No assets yet';$('#notice').textContent=(mode==='storyboard'?'Storyboard approval before video generation. ':'')+'Notes are local until exported and imported.'}

function plain(v){return Array.isArray(v)?v.map(plain).join('\n'):v&&typeof v==='object'?Object.entries(v).filter(([,x])=>x!==undefined&&x!==null&&x!=='').map(([k,x])=>typeof x==='object'?`${k.replace(/_/g,' ')}:\n${plain(x)}`:`${k.replace(/_/g,' ')}: ${x}`).join('\n'):String(v)}

const isAudio=x=>/\.(wav|mp3|m4a|flac|ogg)$/i.test(x||'');
function madeStep(s,i){const settings=[s.backend,s.mode,s.seed!==undefined?'seed '+s.seed:'',...Object.entries(s.settings||{}).map(([k,x])=>k+' '+x),s.elapsed?Math.round(s.elapsed)+' s':''].filter(Boolean).join(', ');

function madeSound(label,audio,steps){return `<div class="made-line"><b>${esc(label)}</b>${audio?`<audio controls preload="none" src="${esc(url(audio))}"></audio>`:''}${(steps||[]).map(madeStep).join('')||'<div class="settings">No generation record</div>'}</div>`}

const lines=mode==='cast'?(v.lines||[]).map(l=>madeSound(l.label||l.line||'Line',l.audio,l.generation)):(n.dialogue||[]).map(l=>madeSound(`${l.line_id||''} ${l.speaker||''}: ${l.line||''}${l.direction?' ('+l.direction+')':''}`,l.audio,l.generation));
const effects=mode==='cast'?[]:(n.sound_files||[]).map(f=>madeSound(f,f,(n.sound_generation||{})[f]));

$('#made-copy').innerHTML=(picture?`<p><b>Picture</b></p>${picture}`:'')+(sound?`<p><b>Sound</b></p>${sound}`:'');$('#made').hidden=!$('#made-copy').innerHTML}

if(!n){$('#monitor-name').textContent='CAST & SOUND';$('#monitor-version').textContent='';$('#monitor-time').textContent='00:00:00:00';$('#badge').textContent='CAST & SOUND';empty('No assets prepared yet','High-resolution actor cards, scene references and voice samples will use this same viewer.');return}

if(mode==='cast'){
const sounds=[...(v.audio&&v.audio!==v.reference_audio?[{label:'Casting sample',audio:v.audio}]:[]),...(v.reference_audio?[{label:'Clone reference',audio:v.reference_audio}]:[]),...(v.lines||[])];
if(image){$('#picture').src=url(image);$('#picture').hidden=false;$('#badge').textContent=(n.kind||'ASSET').toUpperCase()+' / '+v.id;if(sounds.length){$('#audio-stack').style.inset='auto 15px 15px';$('#audio-stack').style.background='#121a20e8';$('#audio-stack').style.padding='12px';}}
else{$('#audio-stack').style.inset='0';$('#audio-stack').style.background='';$('#audio-stack').style.padding='30px';$('#badge').textContent=(n.kind||'AUDIO').toUpperCase()+' / '+v.id;}
if(sounds.length){$('#audio-stack').innerHTML=sounds.map(l=>`<label>${esc(l.label||'Performance')}</label><audio controls preload="none" src="${esc(url(l.audio))}"></audio>`).join('')+(v.transcript?`<p>${esc(v.transcript)}</p>`:'');$('#audio-stack').hidden=false}else if(!image)empty('Asset planned','No reference image or voice recording has been prepared for this version.');return}
if(image){$('#picture').src=url(image);$('#picture').hidden=false;$('#badge').textContent=mode==='shots'?'NO MOTION / '+n.id:'STORYBOARD / '+n.id+' / '+(P.production?.storyboard_version||v.id);if(mode==='shots')toast('This version has no motion clip. Showing its reference.');}
else{empty('Frame pending','This shot has no storyboard or reference image yet.');$('#badge').textContent=n.id;}
}

// prompt-builder:start
// A pure function of the manifest, the drafts and the mode, so a test can run it outside the page.
function buildPrompt(P,draft,mode){
 const decision={approved:'Keep',revise:'Revise',unreviewed:'Unreviewed'};
 // Drafts start from the manifest's status and notes; only a change made on this page counts as touched.
 const touched=n=>{const d=draft[n.id],b=n.versions.find(v=>v.id===d?.base_selected)||{};return Boolean(d&&(d.notes.trim()!==(b.notes||'').trim()||d.review_status!==(b.review_status||'unreviewed')||d.selected!==d.base_selected||Object.keys(d.takes||{}).length))};
 const items=[...P.shots,...P.assets].filter(touched);
 if(!items.length)return null;
 const media=v=>mode==='storyboard'?(v.storyboard_image||v.reference||v.image):(v.video||v.image||v.reference||v.storyboard_image||v.audio);
 const step=(s,i)=>`${s.step||'Step '+(i+1)}: ${[s.backend,s.mode,s.seed!=null?'seed '+s.seed:'',...Object.entries(s.settings||{}).map(([k,x])=>k+' '+x)].filter(Boolean).join(', ')}`;
 const fence=text=>'`'.repeat(Math.max(3,...[...text.matchAll(/`+/g)].map(m=>m[0].length+1)));
 const section=n=>{const d=draft[n.id],v=n.versions.find(x=>x.id===d.selected),file=media(v);
  const lines=[`## ${n.id}: ${n.title||n.review_label||n.label||n.purpose||n.id}`,''];
  if(['approved','revise'].includes(d.review_status))lines.push(`- Decision: ${decision[d.review_status]}`);
  lines.push(`- Take: ${v.id}${file?` (\`${file}\`)`:''}`);
  if(d.selected!==d.base_selected)lines.push(`- Base take: ${d.base_selected}`);
  const made=(v.generation||[]).map(step);
  if(made.length)lines.push('- How it was made:',...made.map(m=>'  - '+m));
  const times=[...d.notes.matchAll(/\[((?:edit|\S+ source) [\d:.]+)\]/g)].map(m=>m[1]);
  if(times.length)lines.push(`- Playhead times: ${times.join(', ')}`);
  const takes=Object.entries(d.takes||{}).filter(([id])=>id!==d.selected);
  if(takes.length)lines.push('- Other takes:',...takes.map(([id,t])=>`  - ${id}: ${decision[t.review_status]||t.review_status}${t.notes?'. '+t.notes:''}`));
  if(d.notes.trim())lines.push('','Note:',fence(d.notes)+'text',d.notes,fence(d.notes));
  return lines.join('\n')};
 const header=[`# Review notes: ${P.title}`,'',`- Project: ${P.id}, revision r${P.revision}`,`- Mode: ${mode}`,`- Storyboard version: ${P.production?.storyboard_version||'none'}`,`- Items: ${items.length}`];
 return header.join('\n')+'\n\n'+items.map(section).join('\n\n')+'\n';
}
// prompt-builder:end
function showPrompt(text){$('#prompt-text').value=text;$('#prompt-dialog').showModal();$('#prompt-text').focus();$('#prompt-text').select()}
$('#prompt-close').onclick=()=>$('#prompt-dialog').close();
$('#copy-prompt').onclick=()=>{const text=buildPrompt(P,draft,mode);if(!text){toast('Nothing to copy: no notes, decisions or changed takes yet.');return}
 if(!navigator.clipboard?.writeText){showPrompt(text);return}
 navigator.clipboard.writeText(text).then(()=>toast('Prompt copied with every note and decision.')).catch(()=>showPrompt(text))};
$('#export').onclick=()=>{const payload={project_id:P.id,base_revision:P.revision,exported_at:new Date().toISOString(),review_template:TEMPLATE,review_context:{mode,storyboard_version:P.production?.storyboard_version||null,storyboard_approval:'not_implied_by_per_version_keep'},shots:P.shots.map(n=>draft[n.id]),assets:P.assets.map(n=>draft[n.id])};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=P.id+'-feedback-r'+P.revision+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Feedback exported. Share the JSON to apply it.')};
$('#project-title').textContent=P.title;document.title=P.title+' · Review';$('#revision').textContent='r'+P.revision;$('#spec').textContent=tc(P.settings.target_seconds)+' · '+P.settings.aspect_ratio;$('#shot-count').textContent=P.shots.length;$('#asset-count').textContent=P.assets.length||'';
$('#tab-shots').disabled=!hasVideo;$('#tab-shots').title=hasVideo?'Review individual takes':'No motion takes yet';$('#tab-edit').disabled=!film;$('#tab-edit').title=film?'Review the assembled edit':'No assembled edit yet';
// Capture navigation before native video controls and mode tabs consume arrows.
window.addEventListener('keydown',e=>{
 const editing=e.target instanceof Element&&e.target.closest('textarea,input,select,[contenteditable]:not([contenteditable="false"])');
 if(lightbox.open){if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();showImage(shown+(e.key==='ArrowRight'?1:-1))}return}
 if(editing||e.metaKey||e.ctrlKey||e.altKey)return;
 if(['ArrowRight','ArrowLeft'].includes(e.key)){
  e.preventDefault();e.stopImmediatePropagation();nextItem(e.key==='ArrowRight'?1:-1);return;
 }
 if(e.code==='Space'&&!player.hidden){e.preventDefault();e.stopImmediatePropagation();$('#play').click()}
},true);
setMode(mode);
const lightbox=$('#lightbox');let gallery=[],shown=0;
function showImage(i){shown=Math.max(0,Math.min(gallery.length-1,i));const link=gallery[shown],pic=link.querySelector('img');
 $('#lightbox-image').src=pic.src;$('#lightbox-image').alt=pic.alt;$('#lightbox-caption').textContent=`${shown+1} / ${gallery.length}  ${link.title||link.textContent.trim()||pic.alt}`}
document.addEventListener('click',e=>{const link=e.target instanceof Element&&e.target.closest('a');if(!link?.querySelector('img'))return;
 e.preventDefault();gallery=[...link.closest('aside,.sheet,body').querySelectorAll('a')].filter(a=>a.querySelector('img'));showImage(gallery.indexOf(link));if(!lightbox.open)lightbox.showModal()});
lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.close()});
$('#lightbox-close').onclick=()=>lightbox.close();
