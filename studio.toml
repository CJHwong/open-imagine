# The backend the page opens with, and the backends it may offer. The page
# shows a model picker only when it may offer more than one. Image offers Qwen
# Turbo only by default. `--backend` opens on another
# one and adds it to the list, and `--all-backends` enables selection in Image,
# Video and Voice. Each model requires its weights before generation; startup
# loads no weights.
default_backend = "qwen21_turbo"
visible_backends = ["qwen21_turbo"]
# Video offers LTX-2.5 only, so its header shows the model name without a picker.
# LTX-2.3 remains optional; --all-backends exposes it. Restore its weights before use.
default_video_backend = "ltx25_mlx"
visible_video_backends = ["ltx25_mlx"]
default_voice_backend = "drama3"
visible_voice_backends = ["drama3"]
default_music_backend = "yue2"
visible_music_backends = ["yue2"]
# App-wide memory policy. Settings > Memory can change it for every caller.
# Saved UI choices override this startup default and survive restarts. Off by
# default: a setup with no measured peak may run, and a measured one still
# enforces its peak.
require_memory_estimate = false
# Model memory. `immediate` frees the loaded model when another one runs, or when the
# page leaves its workspace. `boundary` keeps loaded models and frees the oldest first,
# and only when the next model would take the total past boundary_percent of physical
# memory. A model with no measured footprint is never kept. Admission still checks the
# run's own peak against free memory, with the 8 GiB OS reserve.
[memory]
policy = "immediate"
boundary_percent = 84

# Asynchronous operations wait their turn instead of returning 409 while another one
# runs. max_size counts the requests waiting behind the running one. 0 keeps the old
# behavior, where a busy studio refuses every new operation. A full queue answers 429.
[queue]
max_size = 8

# Share this studio with the phone app over a dumbpipe ticket. The listener binds
# 127.0.0.1 and the server prints a QR code at startup. The ticket is a credential:
# anyone who scans it reaches this studio. The identity file makes the ticket stable
# across restarts. Keep it owner-only; the server creates it with mode 0600.
[connect]
enabled = false
transport = "dumbpipe"
# The port the phone must reach. Keep it equal to the studio's --port.
studio_port = 8765
# Blank runs the precompiled binary in studio/l4_frameworks_and_drivers/bin.
dumbpipe_path = ""
identity_path = "~/.config/open-imagine/dumbpipe-identity"
# The app preferences file contains no operation data. Stub mode keeps settings in memory.
settings_path = "~/.config/open-imagine/settings.json"

[mlx_video]
# Image-aware LTX enhancement runs as its own uv script environment (mlx-vlm 0.7.3),
# not in this CLI environment. It reads the first attached keyframe and frees Gemma
# before video rendering.
# Auto selects a measured reuse profile by output geometry, length, and physical memory.
# Auto shares prompt enhancement before eligible video reuse.
# Enhance_only shares enhancement but creates a fresh video pipeline for each clip.
# Sequential disables cross-clip reuse, including enhancement, for a baseline.
batch_policy = "auto"
# LTX-2.5 Fast mode is selected per request in Video Advanced or with API fast_mode=true.
# It uses float16 transformer computation with the same q8 weights; generated details can differ.
# The 8-bit pack in the cache the other models use, and ffmpeg for padding a short track.
# docs/how-to/set-up-models.md names the download that fills the pack directory. Video's
# engine builds itself from the wrapper the studio ships, so cli_path stays empty. The
# studio runs the wrapper with `uv run --script`, using the uv named by UV or found on
# PATH. A machine that runs only the stub never reads any of this.
ffmpeg_path = "/opt/homebrew/bin/ffmpeg"
model_ltx25 = "~/Library/Caches/models/ltx-2.5-q8"
model_ltx23 = "dgrauet/ltx-2.3-mlx-q8"
# LTX-2.5 effects, including Layout to Render, each use their own adapter file.
# Layout to Render also requires the pack's v1_0 spatial upscaler weights and config.
# Custom Edit uses no task LoRA and does not need this directory or a download.
lora_dir = "~/Library/Caches/models/ltx-2.5-loras"
# Fetch an effect's weights when the file is not there. A download is a side effect the
# person did not ask for, so it is off by default. On, the studio fetches the one file
# the run needs, from the Lightricks collection, the first time that effect runs.
fetch_loras = false

[minimax_h3]
# Optional built-in Video model. See studio/l3_interface_adapters/gateways/video/minimax_h3/README.md.
# Add minimax_h3 to visible_video_backends after installing its engine and weights.
engine_dir = "~/Library/Caches/open-imagine/engines/minimax-h3-63893b3"
model_dir = "~/Library/Caches/models/minimax-h3"

[qwen21]
# bf16 by default, which is 0. Measured on 2026-10-19: no level is faster than another, so a
# quantized one costs accuracy for nothing this machine needs. -q on the command line overrides
# this, and 8 is the level to ask for when memory is the constraint.
quantize = 0
# The prompt rewriters: fine-tuned Qwen3.5-VL 9B, 18.84 GB each, and each is
# released again before an image engine loads. The text one serves generate, the
# image one serves edit. Neither is fetched until the toggle is first used.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"
# A converted checkpoint, used when the directory is there. The repo ids above
# stay as the fallback for a machine that has not converted one.
rewrite_generate_local = "~/Library/Caches/models/qwen-pe-t2i-community/4bit"
rewrite_edit_local = "~/Library/Caches/models/qwen-pe-i2i-community/4bit"
# Unlike the image model, a rewriter is quantized: it writes one token at a time and
# each token reads the whole card, so 8-bit halves a rewrite, 39.7s to 20.4s on
# 2026-10-23. The card is quantized as it loads unless the local checkpoint above
# already carries its own; 0 keeps bf16.
rewrite_quantize = 8

[qwen21_turbo]
# Active Generate/Edit/batch work uses a wired limit bounded by MLX and 75% of RAM.
# The previous process limit is restored while idle; precision is unchanged.
quantize = 0                              # bf16, for the reason above
model_dir = "~/Library/Caches/models/qwen-image-2.1-turbo"
# The checkpoint ships its own eight-node sampling schedule and this backend samples
# it, so 8 steps is the count rather than a setting. `gateways/image/shared/qwen21_turbo_schedule.py`
# holds the table; `docs/explanation/design-decisions.md` explains why it differs from the default table.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"
# A converted checkpoint, used when the directory is there. The repo ids above
# stay as the fallback for a machine that has not converted one.
rewrite_generate_local = "~/Library/Caches/models/qwen-pe-t2i-community/4bit"
rewrite_edit_local = "~/Library/Caches/models/qwen-pe-i2i-community/4bit"
rewrite_quantize = 8                      # as [qwen21]
# Your own LoRAs, one table each; docs/reference/configuration.md lists every key. The
# same tables work under [qwen21], [viggle_turbo], [ltx25_mlx] and [ltx23_mlx].
# max_loras = 1
# [[qwen21_turbo.loras]]
# id = "warm_film"
# label = "Warm film"
# path = "~/loras/warm-film.safetensors"
# trigger = "warm film"

[flux2]
quantize = 0
model_dir = "~/Library/Caches/models/mflux-klein-base-9b-uncensored"   # docs/how-to/set-up-models.md has the download

[flux3]
# Optional distilled checkpoint; Qwen remains the default. The child declares its
# own pinned script environment, so its newer mflux stays out of the host. See the
# model setup guide.
quantize = 8
model_dir = "~/Library/Caches/models/flux3-image-klein"

[krea2]
# Optional 8-step Krea 2 Turbo, text-to-image and img2img from one reference. The
# weights are stored at int8, so this section takes no quantize. About 22 GB; the
# model setup guide has the download.
model_dir = "~/Library/Caches/models/krea-2-turbo-mflux-q8"

[minimax_h3_image]
# Optional six-step MiniMax H3-Image, text-to-image and edit. The int8 weights are about
# 49 GB. The engine, h3-image-mlx, runs in its own pinned environment. Its int8 kernel needs
# an M5 or M6 GPU; another chip takes the engine's portable path, which was not measured.
# Add minimax_h3_image to visible_backends after the setup in the model setup guide. The
# MiniMax-H3-Image Community License limits where and how you may use the weights; see
# docs/reference/model-licenses.md.
model_dir = "~/Library/Caches/models/minimax-h3-image"
python_path = "~/Library/Caches/open-imagine/engines/h3-image-mlx-64df997/bin/python"

[viggle_turbo]
quantize = 0                              # bf16, for the reason above; the LoRA is passed unmerged
# Viggle's distilled 6-step adapter for Qwen-Image-2.1, 1.3 GB. The base weights
# are the ones [qwen21] already downloads. docs/how-to/set-up-models.md has the download recipe.
lora_path = "~/Library/Caches/models/viggle-turbo/Qwen-Image-2.1-viggle-turbo-v0.3-6step-lora-r256.safetensors"
# The same two prompt rewriters as [qwen21]: they are their own models and do not
# depend on which weights draw the image.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"
# A converted checkpoint, used when the directory is there. The repo ids above
# stay as the fallback for a machine that has not converted one.
rewrite_generate_local = "~/Library/Caches/models/qwen-pe-t2i-community/4bit"
rewrite_edit_local = "~/Library/Caches/models/qwen-pe-i2i-community/4bit"
rewrite_quantize = 8                      # as [qwen21]

[auk]
# AuK Flash runs its pinned environment in a lazy resident child.
child_script = "studio/l3_interface_adapters/gateways/voice/auk_runtime/auk_child.py"

[auk_base]
# AuK uses the same pinned child and shared encoder, with its 32-step Base weights.

[drama3]
# The child bounds active wired memory by MLX’s recommendation and 75% of RAM,
# then restores the prior limit while idle. Sampling and precision are unchanged.
# Eight-bit Drama-3 in its separate pinned MLX Audio script environment.
child_script = "studio/l3_interface_adapters/gateways/voice/drama3/drama3_child.py"
# Optional: an existing environment with the exact versions declared by the child.
# python_path = "~/ltx-experiments/drama3-env/bin/python"

[yue2]
# Native MLX Q8 only. Q8 score/token generation, BF16 acoustic synthesis, FP32 decoder.
engine = "mlx-q8"
model_dir = "~/Library/Caches/models/yue2-mlx"
vae_dir = "~/Library/Caches/models/yue2-mlx-vae"
python_path = "~/Library/Caches/yue2-mlx-runtime/c5b5a8190f78c74aa671a4caa19dae8b8e04b3d8/venv/bin/python"

# Separate pinned transcription weights for Reference audio / Cover song.
transcription_cache_dir = "~/Library/Caches/models/yue2-transcription"
