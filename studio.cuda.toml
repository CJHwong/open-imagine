# The NVIDIA setup. Nothing here downloads until a model is prepared, and a run never downloads.
#
#   uv run studio --config studio.cuda.toml --prepare
#   uv run studio --config studio.cuda.toml
#
# Every engine below runs as a PEP 723 script child with its own pinned environment, so
# `uv` must be on the server's PATH. [Run on an NVIDIA machine](docs/how-to/set-up-models.md#run-on-an-nvidia-machine)
# covers the memory each model needs and the packs a prepare builds.

default_backend = "qwen21_turbo_cuda"
visible_backends = ["qwen21_turbo_cuda", "minimax_h3_image_cuda"]
default_video_backend = "ltx25_cuda"
visible_video_backends = ["ltx25_cuda", "minimax_h3_cuda"]
default_voice_backend = "drama3_cuda"
visible_voice_backends = ["drama3_cuda"]
default_music_backend = "yue2_cuda"
visible_music_backends = ["yue2_cuda", "yue2_cuda_nvfp4"]

# bf16, because the pack leaves grain. NVFP4 was measured on this machine and its entry was
# dropped: 11.0 s at 1024 against 12.0, 18.1 at 1328 against 19.1, for 4.7 GiB less memory.
#
# An edit runs this same checkpoint: the pipeline takes reference images through its text
# encoder and vae, so there is no second model to download or load.
#
# Rewrite runs the two prompt cards by name. Remove both lines to hide the toggle. The child
# keeps one card resident and frees it before the other one loads. 8 holds each card's
# language model in fp8: 14.8 tokens/s against 10.1 at bf16 on twelve sampled rewrites, with
# every answer parsed. 0 keeps bf16.
[qwen21_turbo_cuda]
quantize = "bf16"
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"
rewrite_quantize = 8

# fp8 removes the grain NVFP4 leaves on this model; see the configuration reference.
[minimax_h3_image_cuda]
quantize = "fp8"
# The release's own prompt enhancer, a 27B. Remove it to hide Rewrite; it loads on the first
# press and is released before an image run. 8 holds its language model in fp8: 28.4 GiB
# against 51.0, and an edit at 4.4 tokens/s against 3.6. 0 keeps bf16.
rewrite_model = "MiniMaxAI/MiniMax-H3-Image-PE"
rewrite_quantize = 8

# The NVFP4 entry was dropped on 2026-11-20. It held about 40 GiB against fp8's 73 and ran a
# 1024 image in 21.2 s against 6.6, but its pictures were too grainy to use.

[drama3_cuda]
checkpoint = "fishaudio/drama-3"

# Two entries, because the build changes the song and the picker is the backend list. bf16
# is the default: the song is the product, and the quantized builds rewrite it. NVFP4 is
# about 2.5 times faster per second of audio and holds 9.1 GiB instead of 18.1, so it is
# the entry for a machine that is short of time or memory. Measured in
# docs/reference/platform-comparison.md#music.
[yue2_cuda]
quantize = "bf16"

[yue2_cuda_nvfp4]
quantize = "nvfp4"

# MiniMax H3, text or a first and last frame to a 5 to 14 s clip with sound, and pictures with
# an audio track through the reference workflow. The encoder and both transformers land in
# NVFP4 from the bf16 release: 2.0 to 2.2 times as fast as FP8 per step, 56.3 GiB held against
# 93.6 with both in FP8. The first start downloads 134 GB.
[minimax_h3_cuda]
model = "MiniMaxAI/MiniMax-H3"

# Keep a model loaded while the next one fits, so coming back to it costs nothing.
[memory]
policy = "boundary"
boundary_percent = 84

# A server prints a QR code nobody scans.
[connect]
enabled = false
