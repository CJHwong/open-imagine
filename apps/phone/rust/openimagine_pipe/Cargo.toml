[package]
name = "openimagine_pipe"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "openimagine-pipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
iroh-tickets = "1.0.0"
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
jni = "0.21"
ndk-context = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
